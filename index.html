<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>বাইকার স্ট্যান্ড ভেরিফিকেশন</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            background-color: #f4f4f4;
        }
        .card {
            max-width: 400px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .image-placeholder {
            width: 150px;
            height: 150px;
            background-color: #ddd;
            margin: 0 auto 15px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #666;
        }
        .info {
            margin-bottom: 20px;
            text-align: left;
        }
        .info p {
            margin: 10px 0;
            font-size: 18px;
        }
        .rules {
            background-color: #fff3cd;
            color: #856404;
            padding: 15px;
            border-radius: 5px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>বাইকার স্ট্যান্ড</h2>
    <div class="image-placeholder">রাইডারের ছবি</div>
    <div class="info">
        <p><strong>নাম:</strong></p>
        <p><strong>ফোন নম্বর:</strong></p>
    </div>
    <div class="rules">
        সঠিকভাবে নিয়ম মানতে হবে।
    </div>
</div>

</body>
</html>
